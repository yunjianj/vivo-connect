[package]
name = "vivo-connect"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "unstable-winit-030"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "json"] }
serde_json = "=1.0.154"
png = "=0.18.1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
